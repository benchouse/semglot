# semglot: some source constructs could not be transpiled to Lightdash:
# - metric refunded_orders not emitted to Lightdash: no Lightdash primitive (filtered/compound aggregate or unresolved reference)
# - metric refund_rate not emitted to Lightdash: no Lightdash primitive (filtered/compound aggregate or unresolved reference)
# - measure refunded_orders_count on fct_orders not emitted: its expression is not a plain column (case when is_refunded then 1 else 0 end), and a Lightdash column metric must hang off one
# - table fct_orders: column aov not emitted as a dimension: its name collides with metric aov, and Lightdash resolves that clash in favour of the dimension, silently dropping the metric
# - metric units_per_order not emitted to Lightdash: no Lightdash primitive (filtered/compound aggregate or unresolved reference)
# - table fct_order_lines: column net_line_revenue not emitted as a dimension: its name collides with metric net_line_revenue, and Lightdash resolves that clash in favour of the dimension, silently dropping the metric
# - table dim_customer: no metric was derivable from the source, so a row-count metric dim_customer_count was synthesised over customer_sk
# - table dim_product: no metric was derivable from the source, so a row-count metric dim_product_count was synthesised over product_id
# - table dim_channel: no metric was derivable from the source, so a row-count metric dim_channel_count was synthesised over channel_id
version: 2
models:
  - name: fct_orders
    description: Order-grain finance fact. One row per order.
    config:
      meta:
        primary_key: order_id
        joins:
          - join: dim_customer
            sql_on: ${fct_orders.customer_sk} = ${dim_customer.customer_sk}
            relationship: many-to-one
          - join: dim_customer
            sql_on: ${fct_orders.billing_customer_sk} = ${dim_customer.customer_sk}
            relationship: many-to-one
          - join: dim_channel
            sql_on: ${fct_orders.channel_id} = ${dim_channel.channel_id}
            relationship: many-to-one
        metrics:
          aov:
            type: number
            sql: ${net_revenue} / ${orders}
    columns:
      - name: order_id
        description: Order surrogate key.
        config:
          meta:
            dimension:
              type: number
            metrics:
              orders:
                type: count_distinct
      - name: customer_sk
        description: Customer the order belongs to.
        config:
          meta:
            dimension:
              type: number
      - name: is_refunded
        description: Whether the order was refunded.
        config:
          meta:
            dimension:
              type: boolean
      - name: billing_customer_sk
        description: Customer who is billed for the order; may differ from the ordering customer (role-playing dimension, e.g. a corporate account's billing contact).
        config:
          meta:
            dimension:
              type: number
      - name: channel_id
        description: Sales channel the order came through.
        config:
          meta:
            dimension:
              type: number
      - name: order_date
        description: Date the order was placed.
        config:
          meta:
            dimension:
              type: date
      - name: order_gross
        config:
          meta:
            metrics:
              gross_revenue:
                type: sum
      - name: order_net_booked
        config:
          meta:
            metrics:
              net_revenue:
                type: sum
  - name: fct_order_lines
    description: Order-line grain. One row per line item.
    config:
      meta:
        primary_key: order_line_id
        joins:
          - join: fct_orders
            sql_on: ${fct_order_lines.order_id} = ${fct_orders.order_id}
            relationship: many-to-one
          - join: dim_product
            sql_on: ${fct_order_lines.product_id} = ${dim_product.product_id}
            relationship: many-to-one
        metrics:
          net_line_revenue:
            type: sum
            sql: ${TABLE}.net_line_revenue
    columns:
      - name: order_line_id
        description: Line-item surrogate key.
        config:
          meta:
            dimension:
              type: number
      - name: order_id
        description: Order the line belongs to.
        config:
          meta:
            dimension:
              type: number
      - name: product_id
        description: Product sold on the line.
        config:
          meta:
            dimension:
              type: number
      - name: order_date
        description: Date the parent order was placed.
        config:
          meta:
            dimension:
              type: date
      - name: quantity
        config:
          meta:
            metrics:
              units_sold:
                type: sum
  - name: dim_customer
    description: Customer dimension.
    config:
      meta:
        primary_key: customer_sk
    columns:
      - name: customer_sk
        description: Customer surrogate key.
        config:
          meta:
            dimension:
              type: number
            metrics:
              dim_customer_count:
                type: count
      - name: customer_segment
        description: 'Marketing segment. Values: new = First-ever order not yet placed or just placed; returning = Has ordered before; vip = High-value repeat customer; prospect = Signed up, never ordered. Synonyms: segment, customer_type.'
        config:
          meta:
            dimension:
              type: string
      - name: accepts_marketing
        description: Whether the customer opted in to marketing.
        config:
          meta:
            dimension:
              type: boolean
  - name: dim_product
    description: Product dimension.
    config:
      meta:
        primary_key: product_id
    columns:
      - name: product_id
        description: Product surrogate key.
        config:
          meta:
            dimension:
              type: number
            metrics:
              dim_product_count:
                type: count
      - name: category
        description: Product category.
        config:
          meta:
            dimension:
              type: string
      - name: title
        description: Product title.
        config:
          meta:
            dimension:
              type: string
  - name: obt_sales
    description: Wide sales table at order-line grain. One row per order line. Measures only, no metrics.
    config:
      meta:
        primary_key: order_line_id
        joins:
          - join: fct_orders
            sql_on: ${obt_sales.order_id} = ${fct_orders.order_id}
            relationship: many-to-one
    columns:
      - name: order_line_id
        description: Line-item surrogate key.
        config:
          meta:
            dimension:
              type: number
      - name: order_id
        description: Order the line belongs to.
        config:
          meta:
            dimension:
              type: number
      - name: customer_segment
        description: Marketing segment.
        config:
          meta:
            dimension:
              type: string
      - name: is_refunded
        description: Whether the order line was refunded.
        config:
          meta:
            dimension:
              type: boolean
      - name: order_date
        description: Date the order was placed.
        config:
          meta:
            dimension:
              type: date
      - name: quantity
        config:
          meta:
            metrics:
              obt_units_sold:
                type: sum
      - name: net_revenue
        config:
          meta:
            metrics:
              obt_net_revenue_line:
                type: sum
  - name: dim_channel
    description: Sales channel dimension.
    config:
      meta:
        primary_key: channel_id
    columns:
      - name: channel_id
        description: Channel surrogate key.
        config:
          meta:
            dimension:
              type: number
            metrics:
              dim_channel_count:
                type: count
      - name: channel_name
        description: Channel display name.
        config:
          meta:
            dimension:
              type: string
