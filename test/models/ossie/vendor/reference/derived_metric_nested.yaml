version: 0.2.0.dev0
dialects:
- ANSI_SQL
semantic_model:
- name: semantic_model
  datasets:
  - name: orders
    source: schema.table
    fields:
    - name: revenue
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: amount
    - name: cost
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: cost_amount
    - name: expenses
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: expense_amount
  metrics:
  - name: revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(orders.amount)
  - name: cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(orders.cost_amount)
  - name: expenses
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(orders.expense_amount)
  - name: gross_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(orders.amount) - SUM(orders.cost_amount)
  - name: net_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: (SUM(orders.amount) - SUM(orders.cost_amount)) - SUM(orders.expense_amount)
